[agent]
  # ตั้งค่าพื้นฐานให้ทำงานราบรื่นบน Windows
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000       
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "1s"
  precision = "0s"
  omit_hostname = true
  
  # Path ของ State file
  statefile = "D:/IoT_Project/telegraf-1.33.0_windows_amd64/telegraf-1.33.0/telegraf.state"

# --- ส่งข้อมูลไปยัง InfluxDB Server ---
[[outputs.influxdb]]
  urls = ["http://192.168.100.99:5012"]
  database = "machine_db"
  timeout = "10s" 

[[outputs.mqtt]]
  servers = ["tcp://192.168.100.99:1883"]
  topic = "factory/{{ .Tag \"machine_type\" }}/{{ .Tag \"machine_name\" }}/data"
  data_format = "json"
  qos = 2

# --- การอ่านไฟล์ข้อมูล .dat ---
[[inputs.tail]]
  files = ["C:/FCC Hub Auto Visual/*/data/20*.dat"]
  path_tag = "path"
  from_beginning = false
  watch_method = "poll"
  name_override = "data_tb"
  
  data_format = "csv"
  csv_delimiter = ";"
  csv_comment = "$"
  csv_header_row_count = 0
  
  csv_column_names = [
    "machine_name", "date_local", "time_local", "Bottom_Hub_OD_Sleeve", 
    "Hub_ID_Groove_Bottom", "Hub_ID_Groove_Top", "Hub_ECM_Conical_Groove", 
    "Hub_Top_Hub_OD", "cycle_time", "time_interval", 
    "NG_indication_1", "NG_indication_2", "NG_indication_3", 
    "NG_indication_4", "NG_indication_5", "shift", 
    "lot_no", "lot_size", "emp_no", "Drop_Empty_Column"
  ]
  
  csv_tag_columns = ["machine_name"]
  
  csv_column_types = [
    "string", "string", "string", "string", "string", "string", "string", "string", 
    "float", "float", "string", "string", "string", "string", "string", "string", 
    "string", "int", "string", "drop"
  ]
  csv_skip_errors = true

  [inputs.tail.tags]
    machine_type = "AHV"

# --- ส่วนการแกะชื่อ Folder มาเป็น Tag Model ---
[[processors.regex]]
  namepass = ["data_tb"] 

  [[processors.regex.tags]]
    key = "path"
    pattern = '^.*FCC Hub Auto Visual[/\\](?P<Model>[^/\\]+)[/\\]data[/\\].*$'
    replacement = "${Model}"
    result_key = "Model"

# --- ส่วนการยุบรวมข้อมูล และ จัดการเวลา (Starlark) ---
[[processors.starlark]]
  namepass = ["data_tb"]
  source = '''
load("time.star", "time")

# --- [เพิ่มส่วนนี้] ตัวแปร Global สำหรับเก็บค่าล่าสุด ---

state = {

  "last_cycle_time": 0.0,
  "record_id": 0

}

def apply(metric):
    
# --- [ปรับปรุงใหม่] กรองบรรทัดที่มี CHECK MASTER ทิ้ง (แบบไม่สนตัวพิมพ์เล็ก-ใหญ่) ---
    
    # 1. เช็กใน Fields
    for k, v in metric.fields.items():
        if type(v) == "string":
            # แปลงค่า v เป็นตัวพิมพ์เล็กทั้งหมดก่อนเช็ก
            if "master" in v.lower():
                return None
                
    # 2. เช็กใน Tags
    for k, v in metric.tags.items():
        if type(v) == "string":
            # แปลงค่า v เป็นตัวพิมพ์เล็กทั้งหมดก่อนเช็ก
            if "master" in v.lower():
                return None

    # --- [เพิ่มใหม่] บังคับให้ Tag machine_name เป็น AHV-001 ---
    metric.tags["machine_name"] = "AHV-001"

# --- [เพิ่มส่วนนี้] จัดการ Cycle Time > 10 ---
    current_cycle = metric.fields.get("cycle_time")
    
    if current_cycle != None:
        if current_cycle > 10.0:
            # ถ้าค่าปัจจุบัน > 10 ให้เอาค่าจาก state มาใช้
            metric.fields["cycle_time"] = state["last_cycle_time"]
        else:
            # ถ้าค่าปกติ (<= 10) ให้เก็บค่านี้นไว้เป็นค่าล่าสุด (state)
            state["last_cycle_time"] = current_cycle

    # --- 1. ยุบรวมกลุ่ม judg_result ---
    judg_keys = ["Bottom_Hub_OD_Sleeve", "Hub_ID_Groove_Bottom", "Hub_ID_Groove_Top", "Hub_ECM_Conical_Groove", "Hub_Top_Hub_OD"]
    judg_vals = []
    for k in judg_keys:
        v = metric.fields.get(k)
        if v != None and str(v).strip() != "":
            judg_vals.append(str(v))
        metric.fields.pop(k, None) 
    
    metric.fields["judg_result"] = ",".join(judg_vals)


    # --- 2. ยุบรวมกลุ่ม ng_indicator ---
    ng_keys = ["NG_indication_1", "NG_indication_2", "NG_indication_3", "NG_indication_4", "NG_indication_5"]
    ng_vals = []
    for k in ng_keys:
        v = metric.fields.get(k)
        if v != None and str(v).strip() != "":
            ng_vals.append(str(v))
        metric.fields.pop(k, None) 
        
    metric.fields["ng_indicator"] = ",".join(ng_vals)


    # --- 3. แปลง Model จาก Tag ให้เป็น Field และลบ path ทิ้ง ---
    model_val = metric.tags.get("Model")
    if model_val != None:
        metric.fields["Model"] = model_val # เอาค่าไปสร้างเป็น Field
        metric.tags.pop("Model")           # ลบออกจาก Tag
        
    metric.tags.pop("path", None)          # ลบ path ทิ้งด้วย ฐานข้อมูลจะได้สะอาด


    # --- 4. จัดการเวลา ---
    d = metric.fields.get("date_local")
    t = metric.fields.get("time_local")
    
    if type(d) == "string" and type(t) == "string" and d.strip() != "" and t.strip() != "":
        
        if len(t.split(":")[0]) == 1:
            t = "0" + t
            
        dt_string = d + " " + t
        
        parsed_time = time.parse_time(dt_string, "2006-01-02 15:04:05", "Asia/Bangkok")

        cutoff_time = time.now() - time.parse_duration("120h")
        if parsed_time < cutoff_time:
            return None 

        metric.time = parsed_time.unix_nano
        
        utc_time_str = (parsed_time - time.parse_duration("7h")).format("2006-01-02 15:04:05")
        metric.fields["Date_Time_UTC"] = utc_time_str

        # --- [เพิ่มใหม่] เพิ่ม id ที่นับต่อเรื่อยๆ ---
        state["record_id"] += 1
        metric.fields["id"] = state["record_id"]
    else:
        # บรรทัดขยะ: ไม่มีวันที่/เวลา หรือค่าว่าง → Drop ทิ้ง ป้องกัน Timestamp = NOW หลุดเข้า DB
        return None
        
    return metric
'''